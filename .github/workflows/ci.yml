name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      # Inclui o postbuild (scripts/injetar-csp.mjs) — a CSP por página
      # falharia silenciosamente na Vercel se aqui não passasse.
      - run: npm run build
