<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem ligação — Pergunta ao Zé</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #faf6ec; color: #1b1d22;
         font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 1.4rem; } p { color: #4b5563; max-width: 34ch; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 1rem; font-weight: 600;
           color: #fff; background: #046a38; border: 2px solid #1b1d22;
           border-radius: 8px; box-shadow: 3px 3px 0 #1b1d22; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <h1>Sem ligação</h1>
    <p>O Zé precisa de internet para responder. Verifica a ligação e tenta outra vez.</p>
    <button onclick="location.reload()">Tentar outra vez</button>
  </div>
